[package]
name = "icdd"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["point-grey"]
repository = "https://github.com/openbimrs/icdd"
readme = "README.md"
description = "ISO 21597 ICDD alias: re-exports openbim-icdd under the standard's common name."
keywords = ["bim", "openbim", "aec"]
categories = ["parser-implementations", "data-structures"]
include = ["Cargo.toml", "LICENSE", "README.md", "src/lib.rs"]

[dependencies]
# Exact pin prevents the alias and canonical package from exposing different
# versions of the same API in one dependency graph.
openbim-icdd = { path = "../openbim-icdd", version = "=0.2.0" }
